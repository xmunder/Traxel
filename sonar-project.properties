sonar.projectKey=traxel-app
sonar.projectName=traxel-app
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/tests,backend/tests
sonar.test.inclusions=frontend/tests/**/*,backend/tests/**/*
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,backend/.venv/**,backend/__pycache__/**,backend/**/__pycache__/**
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11
sonar.coverage.exclusions=frontend/src/**/*.astro
sonar.sourceEncoding=UTF-8
