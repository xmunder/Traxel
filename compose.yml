services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-vectorizer-backend}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OBS_DB_PATH: ${OBS_DB_PATH:-data/obs.db}
      OBS_RETENTION_DAYS: ${OBS_RETENTION_DAYS:-30}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    volumes:
      - obs_data:/app/data
    networks:
      - vectorizer-app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_BACKEND_ENDPOINT: ${PUBLIC_BACKEND_ENDPOINT:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_BACKEND_ENDPOINT: ${PUBLIC_BACKEND_ENDPOINT:-http://localhost:8000}
    ports:
      - "4321:4321"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - vectorizer-app

networks:
  vectorizer-app:
    name: ${VECTORIZER_NETWORK_NAME:-vectorizer-app}

volumes:
  obs_data:
